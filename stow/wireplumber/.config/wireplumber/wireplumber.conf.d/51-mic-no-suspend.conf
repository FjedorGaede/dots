# Keep ALSA input nodes from being suspended when idle.
#
# Why: WirePlumber suspends an idle input after 5 s, and a microphone then needs
# about a second to wake up. Dictation (dots: dictation, whispy) opens the
# capture on the key press, so the first words of a sentence came back far too
# quiet (-41 dB instead of -24 dB): the words were there and got transcribed, but
# any level display showed nothing. Measured with a constant signal: with this
# setting the start carries the real level from the first 80 ms, without it the
# first ~0.8 s came back full scale and decaying.
#
# Matched by node name pattern rather than one device name, so the same file
# works on every machine and for a plugged-in headset microphone too.
# Outputs (speakers, headphones) still suspend as usual.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
