# hyprsunset — blue-light filter (night light)
# https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
#
# Started in autostart.lua. The active profile is the latest one whose time
# has passed. A manual switch (home menu "Night light", services/NightLightService.qml,
# or `hyprctl hyprsunset identity` / `hyprctl hyprsunset temperature 4500`)
# holds until the next profile time; `hyprctl hyprsunset reset` returns to the
# schedule right away.
#
# NB: 4500 is duplicated in NightLightService.qml (warmTemperature) — keep in sync.

# day: normal colors
profile {
    time = 7:00
    identity = true
}

# evening/night: warm
profile {
    time = 19:00
    temperature = 4500
}
