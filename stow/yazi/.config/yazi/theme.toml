# yazi's preset theme only uses the 16 ANSI colors — ghostty takes those from
# wal (~/.cache/wal/colors-ghostty), so yazi follows `dots theme`. The main
# accent (hovered file) comes from the generated "wal" flavor, see
# dots-cli/theming/adapters/yazi.sh. Never put hex colors here.

[flavor]
dark  = "wal"
light = "wal"

# The preset's "alt" segments (status bar size/percentage, inactive tabs) are
# fg = blue/red on bg = gray (color7) — unreadable. Light text on color8 instead.
[mode]
normal_alt = { fg = "white", bg = "darkgray" }
select_alt = { fg = "white", bg = "darkgray" }
unset_alt  = { fg = "white", bg = "darkgray" }

[tabs]
inactive = { fg = "white", bg = "darkgray" }
