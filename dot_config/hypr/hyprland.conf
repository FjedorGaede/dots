source = ./_shared.conf

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# To make randomly monitors work better use hyprctl monitors all, use the description of the monitor and set the better settings.
# Syntax: monitor=<name>, <resolution>, <offset-x>x<offset-y>, <scale>
# Main Monitors of my devices
monitor=desc:BOE 0x0AF0,preferred,auto,1.333
monitor=desc:LG Electronics LG HDR WQHD 102NTUW9D902,preferred,auto,1.25

# Default monitor (e.g. randomly plugged in monitor) 
monitor=,preferred,auto,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = nautilus
# $browser = google-chrome-stable --ozone-platform=wayland --enable-features=UseOzonePlatform --force-device-scale-factor=0.8
$browser = vivaldi-stable
$menu = walker
$smart-search = rofi -show smartsearch -theme-str 'entry { placeholder: "Smart Search..."; }'


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprpaper 
exec-once = hypridle 
exec-once = tuxedo-control-center
exec-once = waybar


# OSD server
exec-once = swayosd-server
exec-once = swaync

# Walker
exec-once = elephant
exec-once = walker --gapplication-service


#############################
### ENVIRONMENT VARIABLES ###
#############################

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

# toolkit-specific scale
env = GDK_SCALE,1
env = XCURSOR_SIZE,32

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################


# CUSTOM BLUR

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 2
    gaps_out = 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $color5
    col.inactive_border = $color8

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 7

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
	enabled = true
	color = rgba(1a1a1aee)
	range = 4
	render_power = 3
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.3
        vibrancy_darkness = 0.3

        contrast = 1.3
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default

    # Disabel animations for workspaces
    animation=workspaces,0
    # animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    focus_on_activate = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
# Syntax: bind=MODS,key,dispatcher,params
 
$mainMod = SUPER # Sets "Windows" key as main modifier
$mainModShift = SUPER_SHIFT # Sets "Windows" key as main modifier
$enter = RETURN
$esc = ESC

# -- GENERAL -- #
bind = $mainMod, $enter, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, Q, killactive,
bind = $mainModShift, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, G, exec, $smart-search
bind = $mainMod, F, fullscreen, 1
bind = $mainModShift, L, exec, hyprlock
bind = $mainModShift, Q, exec, wlogout
bind = $mainModShift, W, exec, pkill waybar && waybar 

# This is actually currently only for developing the right visualization
bind = $mainModShift, N, exec, swaync-client -t -sw

# -- AGS -- #
$agsWindowName = HomeWindow
blurls = $agsWindowName # Blurs the background of the AGS Window Widget (see AGS)

bind = $mainModShift, H, exec, astal -t $agsWindowName

# -- LID CLOSE -- #
# Suspend the system on lid close 
bindl = , switch:Lid Switch, exec, systemctl suspend

# -- SCREENSHOT -- #
# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window --clipbload-only
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output --clipbload-only
# Screenshot a region
bind = SHIFT, PRINT, exec, hyprshot -m region --clipbload-only


# Move focus with mainMod + vim motion keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainModShift, 1, movetoworkspace, 1
bind = $mainModShift, 2, movetoworkspace, 2
bind = $mainModShift, 3, movetoworkspace, 3
bind = $mainModShift, 4, movetoworkspace, 4
bind = $mainModShift, 5, movetoworkspace, 5
bind = $mainModShift, 6, movetoworkspace, 6
bind = $mainModShift, 7, movetoworkspace, 7
bind = $mainModShift, 8, movetoworkspace, 8
bind = $mainModShift, 9, movetoworkspace, 9
bind = $mainModShift, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# SwayOSD controls 
# Sink volume toggle mute
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
# Source volume toggle mute
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Volume raise with custom value
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume 5
# Volume lower with custom value
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5

# Capslock (If you don't want to use the backend)
bind = , --release Caps_Lock, exec, swayosd-client --caps-lock
bind = , --release Caps_Lock, exec, swayosd-client --caps-lock-led input19::capslock

# Brightness raise with custom value('+' sign needed)
bind = , XF86MonBrightnessUp,  exec, swayosd-client --brightness +10
# Brightness lower with custom value('-' sign needed)
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness -10

# Submaps

# Resize Windows
bind = $mainMod, R, submap, resize
submap = resize

# sets repeatable binds for resizing the active window
binde = ,L,resizeactive,10 0
binde = ,H,resizeactive,-10 0
binde = ,K,resizeactive,0 -10
binde = ,J,resizeactive,0 10

# use reset to go back to the global submap
bind = ,escape,submap,reset

# reset the submap
submap = reset

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.* # You'll probably like this.

# Run in float mode
windowrule = float,class:(blueman-manager)
windowrule = size 80% 80%,class:(blueman-manager)
windowrule = float,class:(org.pulseaudio.pavucontrol)
windowrule = size 60% 60%,class:(org.pulseaudio.pavucontrol)
windowrule = float,class:(nm-connection-editor)

# Vivaldi Settings
$vivaldiClass= class:(vivaldi-stable)
windowrule = float, $vivaldiClass,title:(.*)Settings(.*)
windowrule = size 80% 80%,$vivaldiClass,title:(.*)Settings(.*)

# Vivaldi Bitwarden
windowrule = float, $vivaldiClass,title:(.*)Bitwarden(.*)
windowrule = size 80% 80%,$vivaldiClass,title:(.*)Bitwarden(.*)

# Vivaldi Google Login
windowrule = float, $vivaldiClass,title:^(Anmelden.*)$ 
windowrule = size 80% 80%,$vivaldiClass,title:^(Anmelden.*)$ 

windowrule = float,title:(Impala)
windowrule = center,title:(Impala)
windowrule = size 800 600,title:(Impala)

windowrule = workspace special:calculator,class:(qalculate-gtk)
bind = $mainMod, C, exec, pgrep qalculate-gtk && hyprctl dispatch togglespecialworkspace calculator || qalculate-gtk &

# Spotify on scratchpad
$spotify = initialClass:(Spotify)
windowrule = float,$spotify
windowrule = center,$spotify
windowrule = size 90% 90%,$spotify
windowrule = workspace special:spotify,$spotify
bind = $mainMod, S, exec, ~/.config/hypr/scripts/special-workspaces/spotify.sh

# Bitwarden on scratchpad
$bitwarden = initialClass:(Bitwarden)
windowrule = float,$bitwarden
windowrule = center,$bitwarden
windowrule = size 90% 90%,$bitwarden
windowrule = workspace special:bitwarden,$bitwarden
# bind = $mainMod, B, exec, ~/.config/hypr/scripts/special-workspaces/bitwarden.sh

# Telegram on scratchpad
$telegram = class:(org.telegram.desktop)
windowrule = float,$telegram
windowrule = center,$telegram
windowrule = size 90% 90%,$telegram
windowrule = workspace special:telegram,$telegram
bind = $mainMod, T, exec, ~/.config/hypr/scripts/special-workspaces/telegram.sh

# Obsidian open or focus
bind = $mainMod, O, exec, ~/.config/hypr/scripts/special-workspaces/obsidian.sh

# Disable blur for rofi
windowrule = noblur,class:(Rofi)


# No gaps when only
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]


